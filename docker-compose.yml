version: "3.8"

services:
  mysql:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: logpipe
      MYSQL_USER: logpipe
      MYSQL_PASSWORD: logpipe
    ports: ["3306:3306"]

  kafka:
    image: bitnami/kafka:3.6
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"

  aggregator-service:
    build: ./aggregator-service
    depends_on: [mysql, kafka]
    environment:
      MYSQL_HOST: mysql
      KAFKA_BROKER: kafka:9092
    ports: ["8071:8071", "9090:9090"]

  ingestion-service:
    build: ./ingestion-service
    depends_on: [kafka, aggregator-service]
    environment:
      KAFKA_BROKER: kafka:9092
      AGGREGATOR_GRPC_ADDR: aggregator-service:9090
    ports: ["8070:8070"]

  dashboard:
    build: ./dashboard
    depends_on: [aggregator-service]
    ports: ["3002:80"]
