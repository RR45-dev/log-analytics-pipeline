syntax = "proto3";
package logstats;

option go_package = "logpipe/ingestion/logstatspb";
option java_package = "com.logpipe.aggregator.grpc";
option java_multiple_files = true;

// aggregator-service implements this; ingestion-service (Go) calls it to
// self-monitor downstream error rates.
service LogStats {
  rpc GetErrorRate (ErrorRateRequest) returns (ErrorRateResponse);
}

message ErrorRateRequest {
  string service_name = 1;
  int32 window_minutes = 2;
}

message ErrorRateResponse {
  string service_name = 1;
  int64 total_requests = 2;
  int64 error_count = 3;
  double error_rate = 4;
}
